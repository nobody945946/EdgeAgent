[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent"
version = "2.1.0"
description = "Local coding agent with hot-swappable models and shared inference leases"
requires-python = ">=3.12"
dependencies = ["pypdf==6.19.0", "sqlglot==30.21.0", "pymavlink==2.4.50", "capstone==5.0.9",
                "opencc-python-reimplemented==0.1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "unicorn==2.1.4"]

[project.scripts]
edge-agent = "edge_agent.cli:main"

[tool.setuptools.packages.find]
include = ["edge_agent*"]

[tool.setuptools.package-data]
edge_agent = ["*.mjs", "pi-runtime*.json", "skills/*/*", "adapters/*.gguf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
