name: Verify EdgeAgent
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check edge_agent tests
      - run: python -m pytest -q
  first-launch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install from a checkout with no virtual environment or model assets
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'EdgeAgent-new-user'
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR\System32\WindowsPowerShell\v1.0"
          ./scripts/bootstrap.ps1 -SetupOnly -Backend cpu
          & ./.runtime/git/cmd/git.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Git was not installed in the new environment' }
      - name: Load EdgeAgent and release all model resources
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'EdgeAgent-new-user'
          try {
            & ./.venv/Scripts/python.exe -m edge_agent.cli start
            if ($LASTEXITCODE -ne 0) { throw 'EdgeAgent failed to start' }
          } finally {
            & ./.venv/Scripts/python.exe -m edge_agent.cli stop
          }
